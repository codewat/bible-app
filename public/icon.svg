<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#990026"/>
      <stop offset="100%" stop-color="#550014"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA8010"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Background rounded badge -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <!-- Decorative halo -->
  <circle cx="256" cy="220" r="105" fill="none" stroke="url(#gold)" stroke-width="12" opacity="0.65" stroke-dasharray="8 6"/>
  <!-- Gold Cross -->
  <g filter="url(#shadow)">
    <!-- Vertical beam -->
    <rect x="232" y="90" width="48" height="330" rx="8" fill="url(#gold)"/>
    <!-- Horizontal beam -->
    <rect x="140" y="196" width="232" height="48" rx="8" fill="url(#gold)"/>
    <!-- Flare ornaments -->
    <circle cx="256" cy="90" r="14" fill="url(#gold)"/>
    <circle cx="256" cy="420" r="14" fill="url(#gold)"/>
    <circle cx="140" cy="220" r="14" fill="url(#gold)"/>
    <circle cx="372" cy="220" r="14" fill="url(#gold)"/>
    <circle cx="256" cy="220" r="22" fill="#550014"/>
    <circle cx="256" cy="220" r="14" fill="url(#gold)"/>
  </g>
</svg>

